name: Build VST3 (Windows)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S SCHVocalChorus -B build -A x64
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: SCH-Vocal-Chorus-VST3
          path: build/SCHVocalChorus_artefacts/Release/VST3/
